<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8" />
  <meta name="viewport" content="width=device‑width, initial‑scale=1.0" />
  <title>Stocks Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="chat-sessions">
      <button class="btn new-chat">+ New Chat</button>
      <ul class="sessions-list">
        <!-- loop your saved sessions here -->
        <li>
          <span>Apple Q3 2024 Revenue Analysis</span>
          <button class="icon edit">✏️</button>
          <button class="icon del">🗑️</button>
        </li>
      </ul>
    </div>
    <div class="settings">
      <label for="stock-select">Select Stock Symbol:</label>
      <select id="stock-select">
        <option>AAPL</option>
        <option>GOOG</option>
      </select>
      <div class="how-to">
        <h4>How to Use:</h4>
        <ol>
          <li>Choose a stock from the dropdown.</li>
          <li>Ask a question about its performance.</li>
          <li>Press Enter to get insights.</li>
        </ol>
      </div>
    </div>
  </aside>

  <!-- Main chat area -->
  <main class="chat-area">
    <header class="chat-header">
      <h1>Stocks Chatbot</h1>
      <p class="note">Note: This app currently provides AAPL data exclusively for the year 2024.</p>
    </header>

    <!-- Output & input from your original -->
    <div class="chat-container">
      <div id="output"></div>
      <input
        type="text"
        id="user_input"
        placeholder="Ask about the stock…"
        onkeydown="if(event.key==='Enter') sendMessage()"
      />
    </div>
  </main>

  <!-- Floating company/year panel -->
  <div class="info-panel">
    <div><strong>Company:</strong> {{ company }}</div>
    <div><strong>Year:</strong> {{ year }}</div>
    <form method="get" action="{{ url_for('landing_page') }}">
      <button type="submit">Change</button>
    </form>
  </div>

  <script>
    function sendMessage() {
      const inp = document.getElementById('user_input');
      const text = inp.value.trim();
      if (!text) return;

      // user bubble
      const u = document.createElement('div');
      u.className = 'user-msg fade-in';
      u.textContent = text;
      document.getElementById('output').appendChild(u);
      inp.value = '';

      fetch('/get_response', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({user_input: text})
      })
      .then(r => r.json())
      .then(data => {
        const b = document.createElement('div');
        b.className = 'bot-msg fade-in';
        const img = document.createElement('img');
        img.src = '/static/bot-avatar.png';
        img.className = 'bot-avatar';
        b.appendChild(img);
        b.innerHTML += data.response.replace(/\n/g,'<br>');
        document.getElementById('output').appendChild(b);
        document.getElementById('output').scrollTop = document.getElementById('output').scrollHeight;
      });
    }
  </script>
</body>
</html>
